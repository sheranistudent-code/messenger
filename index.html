<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Umar Khayam - Permanent Messenger PRO</title>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-storage-compat.js"></script>
    <style>
        :root { --wa-teal: #128c7e; --wa-dark: #075e54; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; direction: rtl; display: flex; height: 100vh; background: #e5ddd5; overflow: hidden; }
        
        /* Sidebar */
        .sidebar { width: 30%; min-width: 320px; background: white; border-left: 1px solid #ccc; display: flex; flex-direction: column; box-shadow: 2px 0 5px rgba(0,0,0,0.05); }
        .sidebar-header { background: #ededed; padding: 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #ddd; }
        .search-container { padding: 10px; background: #f6f6f6; border-bottom: 1px solid #eee; }
        .search-container input { width: 100%; padding: 8px 15px; border-radius: 20px; border: 1px solid #ddd; outline: none; font-size: 14px; box-sizing: border-box; }
        
        #contact-list { flex: 1; overflow-y: auto; background: #fff; }
        .contact-item { padding: 12px 15px; border-bottom: 1px solid #f2f2f2; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .contact-item:hover { background: #f5f5f5; }
        .active-chat { background: #e9edef !important; border-right: 5px solid var(--wa-teal); }

        /* Chat Area */
        .chat-area { flex: 1; display: flex; flex-direction: column; position: relative; }
        #msg-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png'); background-color: #e5ddd5; }
        
        .msg { padding: 10px 15px; margin-bottom: 8px; border-radius: 12px; max-width: 80%; font-size: 15px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); position: relative; word-wrap: break-word; }
        .sent { background: #dcf8c6; align-self: flex-start; border-top-left-radius: 0; }
        .received { background: white; align-self: flex-end; border-top-right-radius: 0; }
        .time { font-size: 10px; color: #888; margin-top: 5px; display: block; text-align: left; }
        .sent .time { text-align: right; }
        
        .msg audio { height: 40px; width: 100%; min-width: 220px; margin-top: 5px; }

        /* Controls */
        .controls { background: #f0f0f0; padding: 10px 15px; display: flex; align-items: center; gap: 8px; }
        input[type="text"] { flex: 1; padding: 12px 18px; border-radius: 25px; border: 1px solid #ddd; outline: none; font-size: 15px; }
        .btn-icon { background: none; border: none; font-size: 26px; cursor: pointer; color: #51585c; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
        .rec-active { color: #ff0000; transform: scale(1.2); }
        #rec-timer { display: none; color: red; font-weight: bold; margin-left: 10px; font-size: 14px; }
        
        #preview-box { display: none; background: #fff; padding: 8px 15px; border-radius: 25px; flex: 1; align-items: center; border: 1px solid #ddd; margin: 0 10px; }
        #preview-box audio { height: 30px; flex: 1; }

        /* Registration */
        #registration { position: fixed; inset: 0; background: #f0f2f5; z-index: 10000; display: none; flex-direction: column; align-items: center; justify-content: center; }
        .reg-card { background: white; padding: 35px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; width: 340px; }
    </style>
</head>
<body>

<div id="registration">
    <div class="reg-card">
        <h2 style="color: var(--wa-dark); margin-bottom: 20px;">عمر خیام میسنجر</h2>
        <input type="text" id="my-name" placeholder="آپ کا نام" style="width:100%; padding:12px; margin-bottom:15px; border:1px solid #ddd; border-radius: 8px; box-sizing: border-box;">
        <input type="number" id="my-phone" placeholder="فون نمبر (مثلاً 03001234567)" style="width:100%; padding:12px; margin-bottom:20px; border:1px solid #ddd; border-radius: 8px; box-sizing: border-box;">
        <button onclick="saveMyIdentity()" style="background:var(--wa-teal); color:white; padding:12px; border:none; border-radius:8px; width:100%; cursor:pointer; font-size: 16px; font-weight: bold;">لاگ ان کریں</button>
    </div>
</div>

<div class="sidebar">
    <div class="sidebar-header">
        <button onclick="localStorage.clear(); location.reload();" style="background:none; border:none; font-size:20px; cursor:pointer;" title="لاگ آؤٹ">🚪</button>
        <b id="user-name-display">لوڈنگ...</b>
        <button onclick="addNewContact()" style="background:var(--wa-teal); color:white; border:none; border-radius:50%; width:38px; height:38px; cursor:pointer; font-size:22px;">+</button>
    </div>
    <div class="search-container">
        <input type="text" id="contact-search" placeholder="تلاش کریں..." oninput="syncContacts()">
    </div>
    <div id="contact-list"></div>
</div>

<div class="chat-area">
    <div id="msg-container">
        <div style="text-align:center; margin-top:35%; color:#666; font-size: 18px;">چیٹ شروع کرنے کے لیے کسی رابطے پر کلک کریں</div>
    </div>
    <div class="controls" id="input-bar" style="display:none;">
        <span id="rec-timer">00:00</span>
        <button class="btn-icon" id="mic-btn" onclick="toggleRecording()">🎙️</button>
        
        <div id="preview-box">
            <audio id="audio-preview" controls></audio>
            <button class="btn-icon" onclick="cancelVoice()" style="color:red; font-size:20px; margin-right:10px;">🗑</button>
        </div>

        <input type="text" id="msg-input" placeholder="میسج لکھیں..." onkeypress="if(event.key === 'Enter') handleSend()">
        <button class="btn-icon" id="send-btn" onclick="handleSend()" style="color:var(--wa-teal);">➤</button>
    </div>
</div>

<script>
    // Firebase Setup
    const firebaseConfig = {
        apiKey: "AIzaSyBBZ89AG2dl1CdzJGklV_iu7hJzwzJJhhg",
        authDomain: "my-lite-messenger.firebaseapp.com",
        projectId: "my-lite-messenger",
        storageBucket: "my-lite-messenger.appspot.com",
        messagingSenderId: "1075697497498",
        appId: "1:1075697497498:web:f489bc914c1b6f34c37623"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const storage = firebase.storage();
    db.enablePersistence().catch(() => {});

    let MY_NUM = localStorage.getItem('perm_u_phone');
    let MY_NAME = localStorage.getItem('perm_u_name');
    let TARGET_PHONE = null;
    let recorder;
    let chunks = [];
    let isRec = false;
    let timer;
    let pendingBlob = null;

    if (!MY_NUM) {
        document.getElementById('registration').style.display = 'flex';
    } else {
        document.getElementById('user-name-display').innerText = MY_NAME;
        syncContacts();
    }

    function saveMyIdentity() {
        const n = document.getElementById('my-name').value.trim();
        const p = document.getElementById('my-phone').value.trim();
        if(n && p) {
            localStorage.setItem('perm_u_name', n);
            localStorage.setItem('perm_u_phone', p);
            db.collection('users').doc(p).set({ name: n, phone: p });
            location.reload();
        } else alert("براہ کرم تمام معلومات درست لکھیں");
    }

    function addNewContact() {
        const n = prompt("نام:");
        const p = prompt("فون نمبر:");
        if(n && p && MY_NUM) {
            db.collection('user_vault').doc(MY_NUM).collection('contacts').doc(p.trim()).set({
                name: n, phone: p.trim(), added: Date.now()
            });
        }
    }

    function syncContacts() {
        if(!MY_NUM) return;
        const q = document.getElementById('contact-search').value.toLowerCase();
        db.collection('user_vault').doc(MY_NUM).collection('contacts').orderBy('added', 'desc').onSnapshot(snap => {
            const list = document.getElementById('contact-list');
            list.innerHTML = "";
            snap.forEach(doc => {
                const c = doc.data();
                if (c.name.toLowerCase().includes(q) || c.phone.includes(q)) {
                    const div = document.createElement('div');
                    div.className = `contact-item ${TARGET_PHONE === c.phone ? 'active-chat' : ''}`;
                    div.innerHTML = `<div style="flex:1;" onclick="startChat('${c.phone}', '${c.name}')"><b>${c.name}</b><br><small>${c.phone}</small></div><div onclick="deleteContact('${c.phone}')" style="color:red; font-size:18px; padding:5px;">🗑</div>`;
                    list.appendChild(div);
                }
            });
        });
    }

    function startChat(p, n) {
        TARGET_PHONE = p;
        document.getElementById('input-bar').style.display = 'flex';
        loadMessages();
        syncContacts();
    }

    async function toggleRecording() {
        const btn = document.getElementById('mic-btn');
        const timerEl = document.getElementById('rec-timer');
        const inputEl = document.getElementById('msg-input');
        const previewEl = document.getElementById('preview-box');

        if (!isRec) {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                recorder = new MediaRecorder(stream);
                chunks = [];
                recorder.ondataavailable = e => chunks.push(e.data);
                recorder.onstop = () => {
                    pendingBlob = new Blob(chunks, { type: 'audio/webm' });
                    document.getElementById('audio-preview').src = URL.createObjectURL(pendingBlob);
                    inputEl.style.display = 'none';
                    previewEl.style.display = 'flex';
                    document.getElementById('send-btn').style.color = '#ff9800';
                };
                recorder.start();
                isRec = true;
                btn.classList.add('rec-active');
                btn.innerText = "⏹️";
                timerEl.style.display = 'block';
                let s = 0;
                timer = setInterval(() => {
                    s++;
                    let m = Math.floor(s/60).toString().padStart(2,'0');
                    let sec = (s%60).toString().padStart(2,'0');
                    timerEl.innerText = `${m}:${sec}`;
                }, 1000);
            } catch (err) { alert("مائیکروفون دستیاب نہیں ہے"); }
        } else {
            recorder.stop();
            isRec = false;
            btn.classList.remove('rec-active');
            btn.innerText = "🎙️";
            clearInterval(timer);
            timerEl.style.display = 'none';
        }
    }

    function cancelVoice() {
        pendingBlob = null;
        document.getElementById('preview-box').style.display = 'none';
        document.getElementById('msg-input').style.display = 'block';
        document.getElementById('send-btn').style.color = 'var(--wa-teal)';
    }

    async function handleSend() {
        if(!TARGET_PHONE) return;
        const txtInput = document.getElementById('msg-input');
        const txt = txtInput.value.trim();
        const target = TARGET_PHONE;

        if(txt) {
            db.collection('global_chats').add({ from: MY_NUM, to: target, content: txt, type: 'text', time: Date.now() });
            txtInput.value = "";
        }

        if(pendingBlob) {
            const blob = pendingBlob;
            cancelVoice();
            const tempId = "temp-" + Date.now();
            document.getElementById('msg-container').innerHTML += `<div id="${tempId}" style="text-align:center; color:#888; font-size:12px; margin:5px;">وائس میسج جا رہا ہے...</div>`;
            document.getElementById('msg-container').scrollTop = document.getElementById('msg-container').scrollHeight;

            try {
                const ref = storage.ref(`voices/${Date.now()}.webm`);
                const snap = await ref.put(blob);
                const url = await snap.ref.getDownloadURL();
                await db.collection('global_chats').add({ from: MY_NUM, to: target, content: url, type: 'voice', time: Date.now() });
                document.getElementById(tempId)?.remove();
            } catch (e) { alert("وائس سینڈ کرنے میں غلطی ہوئی!"); }
        }
    }

    function loadMessages() {
        if(!TARGET_PHONE) return;
        db.collection('global_chats').orderBy('time').onSnapshot(snap => {
            const box = document.getElementById('msg-container');
            box.innerHTML = "";
            snap.forEach(doc => {
                const m = doc.data();
                if ((m.from === MY_NUM && m.to === TARGET_PHONE) || (m.from === TARGET_PHONE && m.to === MY_NUM)) {
                    const timeStr = m.time ? new Date(m.time).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : "";
                    const d = document.createElement('div');
                    d.className = `msg ${m.from === MY_NUM ? 'sent' : 'received'}`;
                    if(m.type === 'text') {
                        d.innerHTML = `<div>${m.content}</div><span class="time">${timeStr}</span>`;
                    } else {
                        d.innerHTML = `<audio controls src="${m.content}"></audio><span class="time">${timeStr}</span>`;
                    }
                    box.appendChild(d);
                }
            });
            box.scrollTop = box.scrollHeight;
        });
    }

    function deleteContact(p) {
        if(confirm("ڈیلیٹ کریں؟")) db.collection('user_vault').doc(MY_NUM).collection('contacts').doc(p).delete();
    }
</script>
</body>
</html>
